name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Both ends of the range `engines` promises: the maintenance LTS floor
        # and the active LTS. Testing only one end lets version-specific syntax
        # reach the other unnoticed.
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Test an authored minted destination
        run: node tests/destination-acceptance.mjs

  claude-marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx --yes @anthropic-ai/claude-code@latest plugin validate .
